[package]
name = "polars_quant"
version = "1.0.0"
edition = "2024"

[lib]
name = "polars_quant"
crate-type = ["cdylib"]

[dependencies]
arrayvec = "0.7"
itertools = "0.15"
polars = { version = "0.55", default-features = false, features = ["dtype-struct"] }
pyo3 = { version = "0.29", features = ["abi3-py310"] }
pyo3-polars = { version = "0.28", features = ["derive"] }
ringbuffer = "0.16"
serde = { version = "1", features = ["serde_derive"] }

[profile.release]
codegen-units = 1
lto = true
panic = "abort"
strip = "debuginfo"
